plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.goldencomparator'
version = '1.0.0'

android {
  namespace "expo.modules.goldencomparator"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  sourceSets {
    main {
      // The bundled golden reference photo (android_app/assets/golden/golden_reference.jpg) is packaged as an
      // Android asset and copied to the app's storage natively (GoldenComparator.installBundledGolden): expo-asset
      // does not give a readable file path for bundled assets in an offline build.
      assets.srcDirs += ["${projectDir}/../../../assets/golden"]
      // The part classifier (ONNX, run by OpenCV's DNN module) and its model card: android_app/assets/model/
      assets.srcDirs += ["${projectDir}/../../../assets/model"]
    }
  }
}

// Same CameraX version as expo-camera, so both resolve to one copy.
def camerax_version = "1.6.0"

dependencies {
  // OpenCV for Android (SIFT, findHomography, matchTemplate, CLAHE, ECC ...), Java API + native libs.
  implementation "org.opencv:opencv:4.10.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation "androidx.exifinterface:exifinterface:1.4.2"
  // CameraX's public API (startFocusAndMetering ...) returns ListenableFuture. React Native pins the standalone
  // listenablefuture artifact to an EMPTY stub, so the interface is needed from Guava to compile. At run time the same
  // Guava version is already on the classpath (camera-view -> camera-video -> media3), so compileOnly is enough.
  compileOnly "com.google.guava:guava:33.3.1-android"
}

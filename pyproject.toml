[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-inspection"
version = "0.0.1"
description = "PCB pre-test visual inspection: project foundation (no models yet)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "numpy>=1.24", "Pillow>=10.0", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# --- Visual variations of this same PCB (not separate variants or models) ---
# PCB-18 clarification: "It is the same PCB. Depending on availability, the
# colour may change, but the working/function of the PCB remains the same."
# Colour is a visual/environmental variation recorded per board. Whether one
# inspection model handles all colours, or colour-specific references /
# settings are needed, is decided by experiments (docs/model_strategy.md).
appearance_variations:
  board_colour:
    varies: true                 # PCB-18 clarification
    reported_values: [blue, red, green]   # from the first answer; "may include"
    list_complete: null          # UNKNOWN whether other colours occur
    proportions: null            # UNKNOWN share of each colour among available boards


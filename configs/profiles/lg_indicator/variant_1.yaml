# Inspection profile: LG Indicator / variant 1
#
# One profile = one PCB model + variant (+ revision). It holds everything the
# inspection needs that is specific to this board: verified PCB facts, imaging
# settings, reference data, component map, defect rules and model version.
# See docs/pcb_inspection_spec.md (scope) and docs/production_profile.md
# (KNOWN / UNKNOWN / NEEDS CLARIFICATION).
#
# Same conventions as configs/project.yaml: null = UNKNOWN; ambiguous answers
# stay null and are recorded verbatim under `needs_clarification`.
# Source of all verified values: Production/PCB mentor, 2026-10-02.

profile_id: lg_indicator/variant_1
profile_version: 2
answers_source: "Production/PCB mentor, 2026-10-02 (two rounds)"


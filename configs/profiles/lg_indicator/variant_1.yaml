# --- Decision engine (Phase 8) -----------------------------------------------
# First matching rule applies (list critical rules before "any" rules).
# applies_to: critical / non_critical / any. While thresholds are null every
# matching finding gives REVIEW, and with no required_stages no board can PASS.
decision_engine:
  required_stages: null
  rules:
    - {defect_type: missing_component,       applies_to: critical, fail_threshold: null, review_threshold: null}
    - {defect_type: missing_component,       applies_to: any,      fail_threshold: null, review_threshold: null}
    - {defect_type: damaged_component,       applies_to: any,      fail_threshold: null, review_threshold: null}
    - {defect_type: misaligned_component,    applies_to: any,      fail_threshold: null, review_threshold: null}
    - {defect_type: wrong_component,         applies_to: any,      fail_threshold: null, review_threshold: null}
    - {defect_type: wrong_polarity,          applies_to: any,      fail_threshold: null, review_threshold: null}
    - {defect_type: missing_or_damaged_lead, applies_to: any,      fail_threshold: null, review_threshold: null}
    - {defect_type: broken_trace,            applies_to: any,      fail_threshold: null, review_threshold: null}
    - {defect_type: missing_trace,           applies_to: any,      fail_threshold: null, review_threshold: null}
    - {defect_type: damaged_pcb,             applies_to: any,      fail_threshold: null, review_threshold: null}
    - {defect_type: solder_defect,           applies_to: any,      fail_threshold: null, review_threshold: null}
    - {defect_type: foreign_object,          applies_to: any,      fail_threshold: null, review_threshold: null}
    - {defect_type: other_anomaly,           applies_to: any,      fail_threshold: null, review_threshold: null}

